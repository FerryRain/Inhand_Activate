base: formal_120_sixview_gpu.yaml

environment:
  level: realistic
  action_calibration_path: rebuttal/assets/action_calibration.json
  robustness:
    action_noise_mode: empirical
    action_noise_scale: 0.50
    depth_noise_mm: 1.0
  stress:
    name: contiguous_palm_occlusion
    occlusion_schedule:
      "0": 0.45
      "1": 0.45
    occlusion_default: 0.30

evaluation:
  backend: pytorch3d_cuda
  target_surface_mode: initial_unseen

fusion:
  filter_mode: all

experiment:
  initial_pose_seeds: [15, 16, 17, 18, 19, 20, 21, 22]
  output_dir: rebuttal/results/stress_hole
  counterfactual: true

planners:
  enabled: [ray_gpis_hit_only, ray_gpis]
