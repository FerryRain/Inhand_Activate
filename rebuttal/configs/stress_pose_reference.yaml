base: formal_120_sixview_gpu.yaml

environment:
  level: realistic
  action_calibration_path: rebuttal/assets/action_calibration.json
  robustness:
    action_noise_mode: empirical
    action_noise_scale: 0.50
  stress:
    name: pose_stability_reference

evaluation:
  backend: pytorch3d_cuda
  target_surface_mode: none

fusion:
  filter_mode: all

experiment:
  initial_pose_seeds: [15, 16, 17, 18, 19, 20, 21, 22]
  output_dir: rebuttal/results/stress_pose_reference
  counterfactual: true

planners:
  enabled: [ray_gpis]
