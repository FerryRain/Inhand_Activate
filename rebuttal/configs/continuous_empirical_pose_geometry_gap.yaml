base: continuous_empirical_one_step_prefix.yaml

# Mechanism test for pose coverage versus effective reconstruction coverage.
# The shared initial/prefix pose stream is fully visible to Pose-Novelty, but
# 55% palm/finger occlusion prevents much of that trajectory from entering the
# point cloud. The tested six-second action uses ordinary 15% hand occlusion.
environment:
  level: realistic
  stress:
    name: empirical_pose_geometry_gap
    occlusion_schedule:
      "0": 0.55
      "1": 0.55
      "2": 0.15
    occlusion_default: 0.15
  robustness:
    pose_jitter_deg: 0.0
    drift_per_step_deg: 0.0
    translation_jitter_mm: 0.0
    translation_drift_per_step_mm: 0.0
    pose_outlier_probability: 0.0
    depth_noise_mm: 1.0
    depth_dropout_fraction: 0.03
    mask_morphology_px: 1
    occlusion_fraction: 0.0
    occlusion_fraction_std: 0.0
    occlusion_outlier_probability: 0.0

fusion:
  filter_mode: motion_only
  min_view_change_deg: 8.0

evaluation:
  one_step_primary_metric: selected_recovery_recall@5

experiment:
  output_dir: rebuttal/results/continuous_empirical_pose_geometry_gap
