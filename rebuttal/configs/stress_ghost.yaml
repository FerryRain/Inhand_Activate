base: formal_120_sixview_gpu.yaml

environment:
  level: realistic
  action_calibration_path: rebuttal/assets/action_calibration.json
  robustness:
    action_noise_mode: empirical
    action_noise_scale: 0.50
    depth_noise_mm: 1.0
  stress:
    name: transient_ghost_surface
    pose_outlier_steps: [1]
    pose_outlier_deg: 15.0
    translation_outlier_mm: 8.0

evaluation:
  backend: pytorch3d_cuda
  target_surface_mode: none

fusion:
  filter_mode: all

experiment:
  initial_pose_seeds: [15, 16, 17, 18, 19, 20, 21, 22]
  output_dir: rebuttal/results/stress_ghost
  counterfactual: true

planners:
  enabled: [ray_gpis_uncertainty_only, ray_gpis]
